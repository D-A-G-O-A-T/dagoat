[workspace]
resolver = "2"
members = [
    "crates/goat-protocol",
    "crates/goat-backends",
    "crates/goat-neutrality",
    "crates/goat-ledger",
    "crates/goat-net",
]

# Layer boundary is a compile-time property:
#   * goat-protocol   depends on NO other workspace crate (device-agnostic core).
#   * goat-backends   depends on goat-protocol (implements the trait, below the line).
#   * goat-neutrality is a standalone auditor binary; depends on nothing.
# A protocol module physically cannot `use goat_backends::...` because the dependency
# does not exist in its manifest. This is WP-0.1's enforcement mechanism.

[workspace.package]
version = "0.1.0"
edition = "2021"
# Dual MIT/Apache-2.0, matching the root spine and tools/goat-attestor. This used
# to read "Apache-2.0" alone, which the five member crates then inherited through
# `license.workspace = true` -- so one line published a licence for five crates
# that contradicted the two LICENSE files shipped beside them. Founder decision
# 2026-07-29: one licence story across every published manifest.
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sha3 = "0.10"
ml-dsa = "0.1.1"
